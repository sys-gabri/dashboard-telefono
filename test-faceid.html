<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Test Face ID">
  <meta name="theme-color" content="#111316">
  <title>Test Face ID</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: max(20px, env(safe-area-inset-top)) 16px 40px; background: #111316; color: #eef1f4; font: 16px/1.45 -apple-system, system-ui, sans-serif; }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    p { margin: 0 0 14px; color: #b7bec6; }
    button { display: block; width: 100%; min-height: 50px; margin: 10px 0; border: 0; border-radius: 12px; background: #4fe3ff; color: #06141b; font: 600 17px -apple-system, system-ui, sans-serif; }
    button.sec { background: #2a3037; color: #eef1f4; }
    pre { white-space: pre-wrap; word-break: break-word; background: #1b1f24; border-radius: 12px; padding: 14px; font: 13px/1.5 ui-monospace, Menlo, monospace; }
    #verdict { padding: 14px; border-radius: 12px; background: #2a3037; font-weight: 600; margin: 14px 0; }
    #verdict.ok { background: #123d2a; color: #8df0bd; }
    #verdict.bad { background: #47201c; color: #ffb0a6; }
  </style>
</head>
<body>
  <main>
    <h1>Test Face ID</h1>
    <p>Prova se questo iPhone può ricavare una chiave con Face ID. Usa solo una frase di prova: non apre il file della dashboard e non si collega a Internet.</p>
    <div id="verdict" role="status">Non ancora provato</div>
    <button id="create">1. Crea la passkey di prova</button>
    <button id="unlock">2. Sblocca con Face ID</button>
    <button id="copy" class="sec">Copia il risultato</button>
    <button id="reset" class="sec">Azzera la frase di prova</button>
    <pre id="log" aria-live="polite"></pre>
  </main>
  <script type="module" src="./test-faceid.js"></script>
</body>
</html>
